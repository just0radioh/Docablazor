name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publicar Release
        run: dotnet publish DocaBlazor/DocaBlazor.csproj -c Release -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: docablazor-publish
          path: publish
          if-no-files-found: error
